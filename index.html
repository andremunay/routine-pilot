<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-3VdmZVvU79V2lpVmZxeEGumz4CqY+M7zQYJZ3VFepc0='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="robots" content="noindex"><title>Cue Captain has moved</title></head>
<body><h1>Cue Captain has moved</h1><p><a id="continue" href="https://andremunay.github.io/cue-captain/">Continue to Cue Captain</a></p>
<noscript>Enable JavaScript to carry the complete path, query and routine fragment to the new address.</noscript>
<script>(() => {
  const base = "/routine-pilot";
  let pathname = location.pathname;
  if (base && (pathname === base || pathname.startsWith(base + '/'))) pathname = pathname.slice(base.length);
  if (!pathname) pathname = '/';
  const destination = pathname === '/r' || pathname.startsWith('/r/')
    ? 'https://cuecaptain.pages.dev' + pathname
    : "https://andremunay.github.io/cue-captain" + pathname;
  const target = destination + location.search + location.hash;
  document.getElementById('continue').href = target;
  location.replace(target);
})();</script></body></html>
