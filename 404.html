<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Routine Pilot Page Not Found</title>
    <meta name="description" content="Routine Pilot beta page not found." />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        color-scheme: light;
        --ink: #151615;
        --muted: #58615d;
        --quiet: #eef3ed;
        --paper: #f8faf7;
        --surface: #ffffff;
        --teal: #0e6860;
        --blue: #3546a5;
        --coral: #d6503f;
        --field: #9bbb38;
        --line: rgba(21, 22, 21, 0.16);
        --shadow: 0 22px 62px rgba(21, 22, 21, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        line-height: 1.55;
      }

      a {
        color: inherit;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: rgba(248, 250, 247, 0.92);
      }

      .header-inner,
      main,
      .footer-inner {
        width: min(1040px, calc(100% - 40px));
        margin-inline: auto;
      }

      .header-inner {
        min-height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font:
          700 0.94rem/1 ui-monospace,
          'Cascadia Mono',
          'SFMono-Regular',
          monospace;
        text-decoration: none;
      }

      .brand img {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        box-shadow: var(--shadow);
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 16px;
        color: var(--muted);
        font:
          700 0.82rem/1 ui-monospace,
          'Cascadia Mono',
          'SFMono-Regular',
          monospace;
      }

      .nav a {
        text-decoration: none;
      }

      main {
        display: grid;
        gap: 30px;
        padding-block: clamp(34px, 7vw, 72px);
      }

      .hero {
        display: grid;
        gap: 18px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 12ch;
        font-size: clamp(3rem, 8vw, 6.6rem);
        line-height: 0.9;
      }

      h2 {
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1;
      }

      h3 {
        font-size: 1.12rem;
        line-height: 1.2;
      }

      .lead {
        max-width: 62ch;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.28rem);
      }

      .grid,
      .two-col {
        display: grid;
        gap: 16px;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .two-col {
        grid-template-columns: minmax(0, 0.8fr) minmax(300px, 1.2fr);
      }

      .card,
      .note {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 20px;
      }

      .card {
        display: grid;
        gap: 10px;
      }

      .card p,
      .note p,
      .body-stack {
        color: var(--muted);
      }

      .body-stack {
        display: grid;
        gap: 16px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 8px;
        padding: 12px 16px;
        background: var(--ink);
        color: var(--surface);
        font:
          700 0.88rem/1 ui-monospace,
          'Cascadia Mono',
          'SFMono-Regular',
          monospace;
        text-decoration: none;
      }

      .button.secondary {
        background: transparent;
        color: var(--ink);
      }

      .meta {
        color: var(--blue);
        font:
          700 0.78rem/1.15 ui-monospace,
          'Cascadia Mono',
          'SFMono-Regular',
          monospace;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      video {
        width: 100%;
        max-height: 78svh;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151615;
      }

      footer {
        border-top: 1px solid var(--line);
        padding-block: 24px 38px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 760px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
          padding-block: 16px;
        }

        .nav {
          justify-content: flex-start;
        }

        .grid,
        .two-col {
          grid-template-columns: 1fr;
        }

        .button-row {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="">
          <img src="assets/icon.png" alt="Routine Pilot app icon" />
          <span>Routine Pilot beta</span>
        </a>
        
    <nav class="nav" aria-label="Site">
      <a href="">Beta</a>
      <a href="demo/">Demo</a>
      <a href="support/">Support</a>
      <a href="privacy/">Privacy</a>
    </nav>
      </div>
    </header>
    <main>
        <section class="hero">
          <p class="meta">404</p>
          <h1>Page not found.</h1>
          <p class="lead">Return to the Routine Pilot beta page.</p>
          <div class="button-row"><a class="button" href="./">Open beta page</a></div>
        </section></main>
    <footer>
      <div class="footer-inner">
        <a href="support/">Support</a> · <a href="privacy/">Privacy</a>
      </div>
    </footer>
  </body>
</html>
